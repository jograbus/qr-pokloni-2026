<!DOCTYPE html>
<html lang="hr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR skener poklona 2026</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>*{box-sizing:border-box}body{font:16px Arial,sans-serif;background:#f3f4f6;margin:0;padding:14px;color:#18212b}main{max-width:500px;margin:12px auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 12px #0002}h2{text-align:center}button{background:#e38525;color:#fff;border:0;border-radius:8px;padding:15px;font-size:18px;width:100%;margin-top:12px}button:disabled{opacity:.5}#reader{width:100%;margin:12px auto}#poruka{overflow-wrap:anywhere}#rezultat{display:none;margin-top:16px}iframe{width:100%;height:480px;border:0;background:#fff;border-radius:8px}</style></head><body><main>
<h2>Preuzimanje poklona 2026</h2><p>Usmjerite kameru prema QR kodu.</p><div id="reader"></div><button id="start" onclick="pokreni()">Pokreni kameru</button><p id="poruka"></p>
<div id="rezultat"><iframe id="podaci" title="Podaci o poklonu"></iframe><button onclick="ponovno()">Skeniraj sljedeći QR kod</button></div>
</main><script>
const API='https://script.google.com/macros/s/AKfycbyuaOjQnlGpcZ-6MYmfdB7pYPTkFMFfCWxxhhoilhSJ6V5hpynFzVSeP68IHsbOEmq5/exec';
let skener=null, obradjuje=false;
const el=id=>document.getElementById(id);
function izdvojiKod(t){t=String(t||'').trim();try{const u=new URL(t);t=u.searchParams.get('kod')||'';}catch(e){}return /^[A-ZČĆĐŠŽ]\d{5}$/i.test(t)?t.toUpperCase():'';}
async function pokreni(){if(skener)return;el('start').disabled=true;el('poruka').textContent='Pokretanje kamere...';obradjuje=false;
try{skener=new Html5Qrcode('reader');await skener.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const s=Math.min(w,h,250);return {width:s,height:s};}},async t=>{
if(obradjuje)return;const kod=izdvojiKod(t);if(!kod){el('poruka').textContent='QR kod nije prepoznat.';return;}obradjuje=true;
try{await skener.stop();skener.clear();}catch(e){}skener=null;el('start').style.display='none';el('poruka').textContent='Očitan kod: '+kod;el('rezultat').style.display='block';el('podaci').src=API+'?page=obrada&kod='+encodeURIComponent(kod);
},()=>{});el('poruka').textContent='Kamera je spremna.';el('start').style.display='none';}
catch(e){el('poruka').textContent='Greška kamere: '+(e?.message||String(e));skener=null;el('start').disabled=false;}}
function ponovno(){el('podaci').src='about:blank';el('rezultat').style.display='none';el('start').style.display='block';el('start').disabled=false;el('poruka').textContent='';pokreni();}
</script></body></html>
