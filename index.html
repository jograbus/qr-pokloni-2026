<!DOCTYPE html>
<html lang="hr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preuzimanje poklona 2026</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{font:16px Arial,sans-serif;background:#f3f4f6;margin:0;padding:14px;color:#18212b}
main{max-width:500px;margin:12px auto;background:white;border-radius:14px;padding:20px;box-shadow:0 3px 12px #0002}
h2{text-align:center;margin:0 0 14px}p{text-align:center}label{display:block;margin:14px 0 6px;font-weight:bold}
input{width:100%;padding:14px;font-size:17px;border:1px solid #bbb;border-radius:8px}
button{background:#e38525;color:#fff;border:0;border-radius:8px;padding:15px;font-size:18px;width:100%;margin-top:12px}
button:disabled{opacity:.5}#reader{width:100%;margin:12px auto}#poruka{overflow-wrap:anywhere;color:#555}
#rezultat{display:none;margin-top:18px;border-top:1px solid #ddd;padding-top:10px}
iframe{width:100%;height:410px;border:0;background:white;border-radius:8px}
small{color:#666;display:block;text-align:center;margin-top:10px}
</style></head><body><main>
<h2>Preuzimanje poklona 2026</h2>
<label for="pin">PIN djelatnika</label>
<input id="pin" type="password" autocomplete="off" placeholder="Unesi PIN">
<div id="reader"></div>
<button id="start" onclick="pokreni()">Pokreni kameru</button>
<p id="poruka"></p>
<div id="rezultat"><p id="ocitano"></p><iframe name="odgovor" title="Podaci o preuzimanju"></iframe>
<button onclick="ponovno()">Skeniraj sljedeći QR kod</button></div>
<small>QR kodovi i tablica ostaju nepromijenjeni.</small>
<form id="post" method="POST" target="odgovor" style="display:none">
<input name="kod" id="formKod"><input name="pin" id="formPin"><input name="akcija" value="provjeri">
</form></main>
<script>
// OVDJE UPIŠI URL SVOJE NOVE /exec IMPLEMENTACIJE AKO SE PROMIJENIO.
const API='https://script.google.com/macros/s/AKfycbyuaOjQnlGpcZ-6MYmfdB7pYPTkFMFfCWxxhhoilhSJ6V5hpynFzVSeP68IHsbOEmq5/exec';
let skener=null, radi=false;
const el=id=>document.getElementById(id);
function kodIzQr(tekst){
  tekst=String(tekst||'').trim();
  try{const u=new URL(tekst);tekst=u.searchParams.get('kod')||'';}catch(e){}
  return /^[A-ZČĆĐŠŽ]\d{5}$/i.test(tekst)?tekst.toUpperCase():'';
}
async function pokreni(){
  if(skener)return;
  if(!el('pin').value.trim()){el('poruka').textContent='Najprije unesi PIN.';return;}
  el('start').disabled=true;el('poruka').textContent='Pokretanje kamere...';radi=false;
  try{
    skener=new Html5Qrcode('reader');
    await skener.start({facingMode:'environment'},
      {fps:10,qrbox:(w,h)=>{const s=Math.min(w,h,250);return {width:s,height:s};}},
      async tekst=>{
        if(radi)return;const kod=kodIzQr(tekst);
        if(!kod){el('poruka').textContent='QR kod nije prepoznat.';return;}
        radi=true;el('poruka').textContent='';
        try{await skener.stop();skener.clear();}catch(e){}
        skener=null;el('start').style.display='none';
        el('ocitano').textContent='Očitan kod: '+kod;
        el('rezultat').style.display='block';
        el('formKod').value=kod;el('formPin').value=el('pin').value;
        el('post').action=API;el('post').submit();
      },()=>{});
    el('poruka').textContent='Kamera je spremna.';
  }catch(e){el('poruka').textContent='Greška kamere: '+(e?.message||String(e));
    skener=null;el('start').disabled=false;}
}
function ponovno(){el('rezultat').style.display='none';el('start').style.display='block';el('start').disabled=false;pokreni();}
</script></body></html>
